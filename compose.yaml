name: atacuisine
# Budget de connexions PostgreSQL (max_connections=100) : app 20, workers 6+4+3,
# Keycloak 20. Voir docs/platform/WORKER_GROUPS.md.
x-worker-environment: &worker-environment
  ATACUISINE_DEMO: "false"
  WORKER_DATABASE_URL: postgresql://atacuisine_jobs:${WORKER_DB_PASSWORD}@postgres:5432/atacuisine
  APP_URL: ${APP_URL}
  OIDC_ISSUER: ${IDENTITY_URL}/realms/atacuisine
  OIDC_CLIENT_ID: atacuisine
  OIDC_BACKCHANNEL_ORIGIN: http://keycloak:8080
  SESSION_SECRET: ${SESSION_SECRET:?required}
  INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  ATACUISINE_STRIPE_LIVE_APPROVED: ${ATACUISINE_STRIPE_LIVE_APPROVED:-false}
  ATACUISINE_COMMISSION_BP: ${ATACUISINE_COMMISSION_BP:-700}
  ATACUISINE_STRIPE_FEE_BP: ${ATACUISINE_STRIPE_FEE_BP:-300}
  ATACUISINE_PAYOUT_HOLD_DAYS: ${ATACUISINE_PAYOUT_HOLD_DAYS:-31}
  SOURCE_URL: ${SOURCE_URL}
  S3_ENDPOINT: http://storage:3900
  S3_BUCKET: ${S3_BUCKET}
  S3_REGION: garage
  S3_PATH_STYLE: "true"
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
x-worker: &worker
  image: ${ATACUISINE_IMAGE:-atacuisine-os:local}
  pull_policy: never
  command: [node, --import, tsx, scripts/worker.ts]
  restart: unless-stopped
  depends_on:
    migrate: { condition: service_completed_successfully }
  stop_grace_period: 3m
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - process.exit(Date.now()-require("fs").statSync("/tmp/worker-alive").mtimeMs<60000?0:1)
    interval: 30s
    start_period: 30s
    retries: 3
services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: atacuisine_migrator
      POSTGRES_DB: atacuisine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?required}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?required}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?required}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U atacuisine_migrator -d atacuisine"]
      interval: 5s
      retries: 20
  migrate:
    image: ${ATACUISINE_IMAGE:-atacuisine-os:local}
    build: .
    command: [node, --import, tsx, scripts/migrate.ts]
    environment:
      MIGRATION_DATABASE_URL: postgresql://atacuisine_migrator:${POSTGRES_PASSWORD}@postgres:5432/atacuisine
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  app:
    image: ${ATACUISINE_IMAGE:-atacuisine-os:local}
    pull_policy: never
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      ATACUISINE_DEMO: "false"
      DB_POOL_SIZE: ${APP_DB_POOL_SIZE:-20}
      DATABASE_URL: postgresql://atacuisine_web:${APP_DB_PASSWORD}@postgres:5432/atacuisine
      APP_URL: ${APP_URL}
      OIDC_ISSUER: ${IDENTITY_URL}/realms/atacuisine
      OIDC_CLIENT_ID: atacuisine
      OIDC_BACKCHANNEL_ORIGIN: http://keycloak:8080
      SESSION_SECRET: ${SESSION_SECRET:?required}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ATACUISINE_STRIPE_LIVE_APPROVED: ${ATACUISINE_STRIPE_LIVE_APPROVED:-false}
      ATACUISINE_COMMISSION_BP: ${ATACUISINE_COMMISSION_BP:-700}
      ATACUISINE_STRIPE_FEE_BP: ${ATACUISINE_STRIPE_FEE_BP:-300}
      ATACUISINE_PAYOUT_HOLD_DAYS: ${ATACUISINE_PAYOUT_HOLD_DAYS:-31}
      SOURCE_URL: ${SOURCE_URL}
      S3_ENDPOINT: http://storage:3900
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: garage
      S3_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    depends_on:
      migrate: { condition: service_completed_successfully }
      keycloak: { condition: service_started }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 30s
      retries: 3
  worker-critical:
    <<: *worker
    cpus: ${WORKER_CRITICAL_CPUS:-1}
    mem_limit: ${WORKER_CRITICAL_MEMORY:-512m}
    environment:
      <<: *worker-environment
      WORKER_GROUP: critical
      WORKER_HEALTH_FILE: /tmp/worker-alive
      DB_POOL_SIZE: "6"
  worker-maintenance:
    <<: *worker
    cpus: ${WORKER_MAINTENANCE_CPUS:-1}
    mem_limit: ${WORKER_MAINTENANCE_MEMORY:-512m}
    environment:
      <<: *worker-environment
      WORKER_GROUP: maintenance
      WORKER_HEALTH_FILE: /tmp/worker-alive
      DB_POOL_SIZE: "4"
  worker-media:
    <<: *worker
    cpus: ${WORKER_MEDIA_CPUS:-2}
    mem_limit: ${WORKER_MEDIA_MEMORY:-2g}
    environment:
      <<: *worker-environment
      WORKER_GROUP: media
      WORKER_HEALTH_FILE: /tmp/worker-alive
      DB_POOL_SIZE: "3"
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: [start, --import-realm]
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/atacuisine_identity
      KC_DB_USERNAME: atacuisine_identity
      KC_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      KC_DB_POOL_MAX_SIZE: "20"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
      KC_HOSTNAME: ${IDENTITY_URL:?required}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      APP_URL: ${APP_URL:?required}
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      [
        "./infra/keycloak/realm.json:/opt/keycloak/data/import/atacuisine-realm.json:ro",
      ]
    depends_on:
      postgres: { condition: service_healthy }
  storage:
    image: dxflrs/garage:v2.5.0
    command: [/garage, server, --single-node, --default-bucket]
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?required}
      GARAGE_DEFAULT_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?required}
      GARAGE_DEFAULT_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?required}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:?required}
    volumes:
      - media:/var/lib/garage
      - ./infra/garage/garage.toml:/etc/garage.toml:ro

volumes:
  postgres:
  media:
